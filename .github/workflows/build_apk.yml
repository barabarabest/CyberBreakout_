name: Build Android APK (Cyber Breakout)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK with Buildozer
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build with Buildozer Action
        uses: digreatbrian/buildozer-action@v2
        with:
          python-version: "3.11"
          buildozer-cmd: buildozer -v android debug

      - name: Upload APK as Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberBreakout-APK
          path: bin/*.apk
          retention-days: 30
          if-no-files-found: error
